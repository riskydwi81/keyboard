name: Build BlurKeyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o BlurKeyboard.zip
          echo "Project extracted:"
          find BlurKeyboard -maxdepth 3 -type f | head -50
          
      - name: Fix MainActivity
        run: |
          FILE="BlurKeyboard/app/src/main/java/com/example/blurkeyboard/MainActivity.kt"

          sed -i 's/text = getString(R.string.open_ime_settings)/this.text = getString(R.string.open_ime_settings)/g' "$FILE"
          sed -i 's/text = getString(R.string.switch_keyboard)/this.text = getString(R.string.switch_keyboard)/g' "$FILE"

          echo "=== MainActivity after fix ==="
          sed -n '25,50p' "$FILE"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: BlurKeyboard
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlurKeyboard-APK
          path: BlurKeyboard/app/build/outputs/apk/debug/*.apk
