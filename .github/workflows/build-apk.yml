name: Build iOS Style Blur Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract keyboard project
        run: |
          mkdir buildsrc
          unzip -q "CleanBlurKeyboard_iOS_Glass.zip" -d buildsrc
          echo "=== Project files ==="
          find buildsrc -maxdepth 3 -type f | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlurKeyboard-iOS-Glass-APK
          path: buildsrc/app/build/outputs/apk/debug/*.apk
