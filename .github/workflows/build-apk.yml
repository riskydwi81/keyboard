name: Build BlurGlass Keyboard APK

on:
  push:
    branches:
      - main
    paths:
      - 'BlurGlassKeyboard-Final.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q "BlurGlassKeyboard-Final.zip" -d project

          echo "=== Isi ZIP ==="
          find project -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name "settings.gradle.kts" -o -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew tidak ditemukan, menggunakan Gradle bawaan runner."
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          echo "=== APK yang berhasil dibuat ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlurGlassKeyboard-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
